name: Appointment Integration CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  docker:
    name: Build, Push, and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/carenova-appointment-integration:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/carenova-appointment-integration:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_APPOINTMENT_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_APPOINTMENT_PUBLISH_PROFILE }}
          images: ${{ secrets.DOCKERHUB_USERNAME }}/carenova-appointment-integration:${{ github.sha }}
